name: Desktop core checks

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-check.yml'

jobs:
  desktop-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile desktop/app.py desktop/downloader.py desktop/platforms.py desktop/transcriber.py desktop/test_core.py
      - name: Core unit tests
        working-directory: desktop
        run: python test_core.py
