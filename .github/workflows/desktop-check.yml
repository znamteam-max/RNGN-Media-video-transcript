name: Desktop core checks

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-check.yml'

jobs:
  desktop-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q desktop/rngn desktop/main.py desktop/tests
      - name: Core unit tests
        working-directory: desktop
        run: python -m unittest discover -s tests -t . -v
      - name: UI script syntax
        run: |
          node -e "for (const f of ['desktop/ui/app.js','desktop/ui/mock.js']) new Function(require('fs').readFileSync(f,'utf8'))"
