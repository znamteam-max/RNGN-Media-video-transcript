name: Build Windows desktop installer

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rngn-media-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read app version
        shell: pwsh
        run: |
          $version = python -c "import re,pathlib;print(re.search(r'APP_VERSION = \"([^\"]+)\"', pathlib.Path('desktop/rngn/__init__.py').read_text(encoding='utf-8')).group(1))"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building RNGN Media $version"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller

      - name: Core tests
        working-directory: desktop
        run: python -m unittest discover -s tests -t . -v

      - name: Download media runtime tools
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/bootstrap_tools.ps1

      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean desktop/rngn-media.spec
          New-Item -ItemType Directory -Force -Path "dist/RNGN Media/tools" | Out-Null
          Copy-Item "desktop/tools/*" "dist/RNGN Media/tools/" -Recurse -Force

      - name: Smoke test packaged files
        shell: pwsh
        run: |
          if (!(Test-Path "dist/RNGN Media/RNGN Media.exe")) { throw "Packaged EXE missing" }
          foreach ($ui in @("index.html","app.css","app.js")) {
            if (!(Test-Path "dist/RNGN Media/_internal/ui/$ui")) { throw "UI file missing: $ui" }
          }
          if (!(Test-Path "dist/RNGN Media/_internal/webview/lib/Microsoft.Web.WebView2.Core.dll")) { throw "WebView2 bridge missing" }
          $required = @("yt-dlp.exe","gallery-dl.exe","ffmpeg.exe","ffprobe.exe","deno.exe")
          foreach ($name in $required) {
            if (!(Test-Path "dist/RNGN Media/tools/bin/$name")) { throw "Missing tool: $name" }
          }
          if (!(Test-Path "dist/RNGN Media/tools/yt-dlp-plugins/bgutil-ytdlp-pot-provider.zip")) {
            throw "PO Token plugin missing"
          }
          if (!(Test-Path "dist/RNGN Media/tools/bgutil-ytdlp-pot-provider/server/src/generate_once.ts")) {
            throw "PO Token provider source missing"
          }
          if (!(Test-Path "dist/RNGN Media/tools/bgutil-ytdlp-pot-provider/server/node_modules")) {
            throw "PO Token provider dependencies missing"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$env:VERSION" "desktop\rngn-media.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RNGN-Media-Windows-${{ env.VERSION }}
          path: installer-dist/RNGN-Media-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish desktop release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag -y
          }
          gh release create $tag "installer-dist/RNGN-Media-Setup-$env:VERSION.exe" --target "$env:GITHUB_SHA" --title "RNGN Media Desktop v$env:VERSION" --notes-file desktop/RELEASE_NOTES.md
