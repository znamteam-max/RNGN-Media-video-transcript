name: Build macOS desktop app

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rngn-media-macos-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple-Silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller

      - name: Install macOS media build tools
        run: |
          brew install ffmpeg dylibbundler

      - name: Prepare bundled media tools
        run: |
          chmod +x desktop/bootstrap_tools_macos.sh
          desktop/bootstrap_tools_macos.sh

      - name: Core tests
        working-directory: desktop
        run: python test_core.py

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "RNGN Media" \
            --osx-bundle-identifier "com.rngn.media" \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            desktop/app.py

      - name: Bundle media tools into app
        run: |
          APP="dist/RNGN Media.app"
          mkdir -p "$APP/Contents/Resources/tools/bin" "$APP/Contents/Resources/tools/lib"
          cp desktop/tools/bin/* "$APP/Contents/Resources/tools/bin/"
          cp desktop/tools/lib/* "$APP/Contents/Resources/tools/lib/" 2>/dev/null || true
          chmod +x "$APP/Contents/Resources/tools/bin/"*
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.3.3" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 0.3.3" "$APP/Contents/Info.plist" || true

      - name: Smoke test bundled tools
        run: |
          APP="dist/RNGN Media.app"
          BIN="$APP/Contents/Resources/tools/bin"
          test -x "$BIN/yt-dlp"
          test -x "$BIN/gallery-dl"
          test -x "$BIN/ffmpeg"
          test -x "$BIN/ffprobe"
          test -x "$BIN/deno"
          "$BIN/yt-dlp" --version
          "$BIN/gallery-dl" --version
          "$BIN/ffmpeg" -version | head -n 1
          "$BIN/ffprobe" -version | head -n 1
          "$BIN/deno" --version | head -n 1
          file "$APP/Contents/MacOS/RNGN Media"

      - name: Ad-hoc sign app
        run: |
          APP="dist/RNGN Media.app"
          find "$APP/Contents/Resources/tools" -type f -perm +111 -print0 | while IFS= read -r -d '' file; do
            codesign --force --sign - "$file" || true
          done
          find "$APP/Contents/Resources/tools/lib" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null | while IFS= read -r -d '' file; do
            codesign --force --sign - "$file" || true
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        run: |
          STAGE="dmg-stage"
          APP="dist/RNGN Media.app"
          DMG="RNGN-Media-macOS-${{ matrix.label }}-0.3.3.dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "RNGN Media" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RNGN-Media-macOS-${{ matrix.label }}-0.3.3
          path: RNGN-Media-macOS-${{ matrix.label }}-0.3.3.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RNGN-Media-macOS-*-0.3.3
          merge-multiple: true
          path: release

      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macos-v0.3.3"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

          gh release create "$TAG" release/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RNGN Media macOS v0.3.3" \
            --notes "macOS build of RNGN Media v0.3.3 for Apple Silicon and Intel. Includes downloader, faster-whisper transcription, YouTube subtitles, yt-dlp, gallery-dl, Deno and bundled FFmpeg. App is ad-hoc signed but not Apple-notarized yet."
