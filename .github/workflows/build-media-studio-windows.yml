name: Build RNGN Media Studio for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-media-studio-windows.yml"

concurrency:
  group: build-rngn-media-studio-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements-desktop.txt

      - name: Install Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r desktop/requirements-desktop.txt
          python -m pip install pyinstaller

      - name: Download downloader runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $PWD "desktop\vendor\tools"
          $temp = Join-Path $env:RUNNER_TEMP "rngn-media-tools"
          New-Item -ItemType Directory -Force -Path $tools, $temp | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 20 --max-time 600 -o "$tools\yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.09.16.232951/yt-dlp.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 20 --max-time 600 -o "$tools\gallery-dl.exe" "https://github.com/gdl-org/builds/releases/latest/download/gallery-dl_windows.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 20 --max-time 600 -o "$temp\deno.zip" "https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-pc-windows-msvc.zip"
          Expand-Archive "$temp\deno.zip" "$temp\deno" -Force
          Copy-Item "$temp\deno\deno.exe" "$tools\deno.exe" -Force
          curl.exe -L --fail --retry 3 --connect-timeout 20 --max-time 900 -o "$temp\ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive "$temp\ffmpeg.zip" "$temp\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$temp\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem "$temp\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg files were not found" }
          Copy-Item $ffmpeg.FullName "$tools\ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "$tools\ffprobe.exe" -Force

      - name: Smoke-test downloader tools
        shell: powershell
        run: |
          & "desktop\vendor\tools\yt-dlp.exe" --version
          & "desktop\vendor\tools\deno.exe" --version
          & "desktop\vendor\tools\ffmpeg.exe" -version | Select-Object -First 1

      - name: Python syntax checks
        shell: powershell
        run: |
          python -m py_compile desktop\unified_app.py desktop\media_downloader.py desktop\desktop_app.py desktop\desktop_v7.py desktop\desktop_v8.py desktop\desktop_v9.py desktop\desktop_v11.py desktop\desktop_v12.py desktop\subtitle_audio_engine.py desktop\video_converter.py

      - name: Build portable app
        shell: powershell
        run: |
          Set-Location desktop
          pyinstaller --noconfirm --clean RNGN-Media-Studio.spec
          if (-not (Test-Path "dist\RNGN-Media-Studio\RNGN-Media-Studio.exe")) { throw "PyInstaller did not create RNGN-Media-Studio.exe" }
          Compress-Archive -Path "dist\RNGN-Media-Studio\*" -DestinationPath "RNGN-Media-Studio-Portable.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          Set-Location desktop
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $iscc = $candidate.FullName }
          }
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc "installer\RNGN-Media-Studio.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer-output\RNGN-Media-Studio-Setup.exe")) { throw "Installer was not created" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RNGN-Media-Studio-Windows-Installer
          path: desktop/installer-output/RNGN-Media-Studio-Setup.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: RNGN-Media-Studio-Windows-Portable
          path: desktop/RNGN-Media-Studio-Portable.zip
          retention-days: 14
          if-no-files-found: error
