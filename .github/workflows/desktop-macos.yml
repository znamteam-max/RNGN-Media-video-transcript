name: Build macOS desktop app

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rngn-media-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple-Silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read app version
        run: |
          VERSION=$(python -c "import re,pathlib;print(re.search(r'APP_VERSION = \"([^\"]+)\"', pathlib.Path('desktop/rngn/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building RNGN Media $VERSION"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller gallery-dl pillow

      - name: Install macOS media build tools
        run: |
          brew install ffmpeg dylibbundler

      - name: Prepare bundled media tools
        run: |
          chmod +x desktop/bootstrap_tools_macos.sh
          desktop/bootstrap_tools_macos.sh

      - name: Ensure native gallery-dl binary
        run: |
          GDL="desktop/tools/bin/gallery-dl"
          ARCH="$(uname -m)"
          echo "Runner architecture: $ARCH"
          file "$GDL"

          if [[ "$ARCH" == "x86_64" ]] && ! file "$GDL" | grep -q "x86_64"; then
            printf '%s\n' 'import gallery_dl' 'raise SystemExit(gallery_dl.main())' > /tmp/gallery_dl_launcher.py
            rm -rf /tmp/gallery-dl-build /tmp/gallery-dl-dist
            pyinstaller --noconfirm --clean --onefile \
              --name "gallery-dl" \
              --distpath /tmp/gallery-dl-dist \
              --workpath /tmp/gallery-dl-build \
              /tmp/gallery_dl_launcher.py
            cp /tmp/gallery-dl-dist/gallery-dl "$GDL"
            chmod +x "$GDL"
          fi

          if [[ "$ARCH" == "arm64" ]] && ! file "$GDL" | grep -q "arm64"; then
            printf '%s\n' 'import gallery_dl' 'raise SystemExit(gallery_dl.main())' > /tmp/gallery_dl_launcher.py
            rm -rf /tmp/gallery-dl-build /tmp/gallery-dl-dist
            pyinstaller --noconfirm --clean --onefile \
              --name "gallery-dl" \
              --distpath /tmp/gallery-dl-dist \
              --workpath /tmp/gallery-dl-build \
              /tmp/gallery_dl_launcher.py
            cp /tmp/gallery-dl-dist/gallery-dl "$GDL"
            chmod +x "$GDL"
          fi

          file "$GDL"
          "$GDL" --version

      - name: Core tests
        working-directory: desktop
        run: python -m unittest discover -s tests -t . -v

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean desktop/rngn-media.spec

      - name: Bundle media tools into app
        run: |
          APP="dist/RNGN Media.app"
          mkdir -p "$APP/Contents/Resources/tools"
          cp -R desktop/tools/. "$APP/Contents/Resources/tools/"
          chmod +x "$APP/Contents/Resources/tools/bin/"*
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist" || true

      - name: Smoke test bundled tools
        run: |
          APP="dist/RNGN Media.app"
          BIN="$APP/Contents/Resources/tools/bin"
          test -x "$BIN/yt-dlp"
          test -x "$BIN/gallery-dl"
          test -x "$BIN/ffmpeg"
          test -x "$BIN/ffprobe"
          test -x "$BIN/deno"
          "$BIN/yt-dlp" --version
          "$BIN/gallery-dl" --version
          "$BIN/ffmpeg" -version | head -n 1
          "$BIN/ffprobe" -version | head -n 1
          "$BIN/deno" --version | head -n 1
          test -f "$APP/Contents/Resources/tools/yt-dlp-plugins/bgutil-ytdlp-pot-provider.zip"
          test -f "$APP/Contents/Resources/tools/bgutil-ytdlp-pot-provider/server/src/generate_once.ts"
          test -d "$APP/Contents/Resources/tools/bgutil-ytdlp-pot-provider/server/node_modules"
          file "$APP/Contents/MacOS/RNGN Media"

      - name: Ad-hoc sign app
        run: |
          APP="dist/RNGN Media.app"
          find "$APP/Contents/Resources/tools" -type f -perm +111 -print0 | while IFS= read -r -d '' file; do
            codesign --force --sign - "$file" || true
          done
          find "$APP/Contents/Resources/tools/lib" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null | while IFS= read -r -d '' file; do
            codesign --force --sign - "$file" || true
          done
          find "$APP/Contents/Resources/tools" -type f -name "*.node" -print0 2>/dev/null | while IFS= read -r -d '' file; do
            codesign --force --sign - "$file" || true
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        run: |
          STAGE="dmg-stage"
          APP="dist/RNGN Media.app"
          DMG="RNGN-Media-macOS-${{ matrix.label }}-$VERSION.dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "RNGN Media" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RNGN-Media-macOS-${{ matrix.label }}-${{ env.VERSION }}
          path: RNGN-Media-macOS-${{ matrix.label }}-${{ env.VERSION }}.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'APP_VERSION = \"([^\"]+)\"', pathlib.Path('desktop/rngn/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: RNGN-Media-macOS-*-${{ env.VERSION }}
          merge-multiple: true
          path: release

      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macos-v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&             gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

          gh release create "$TAG" release/*.dmg             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "RNGN Media macOS v$VERSION"             --notes-file desktop/RELEASE_NOTES.md
